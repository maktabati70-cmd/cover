name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK (مثبّت مسبقاً على خوادم GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle studio (React + Konva + fonts داخل التطبيق)
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          node build.mjs
          ls -la ../app/src/main/assets
          test -s ../app/src/main/assets/app.js || (echo "❌ app.js لم يُنشأ" && exit 1)
          node manifest.mjs

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/CoverStudio-v1.0.${{ github.run_number }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoverStudio-APK
          path: out/*.apk

      - name: Publish release (رابط تنزيل مباشر للهاتف)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: استوديو الأغلفة v1.0.${{ github.run_number }}
          files: out/*.apk

      - name: Publish silent web update (التحديث الصامت داخل التطبيق)
        run: |
          rm -rf /tmp/webupd && mkdir -p /tmp/webupd
          cp -r app/src/main/assets/. /tmp/webupd/
          cd /tmp/webupd
          git init -q
          git checkout -q -b web-update
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "web update ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" web-update
