<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0d0b09" />
<title>استوديو الأغلفة السينمائي</title>
<link rel="stylesheet" href="fonts.css" />
<link rel="stylesheet" href="styles.css" />
<style>



:root {
  color-scheme: dark;
}

html,
body {
  height: 100%;
  background: #070605;
  color: #e7e0d4;
  overflow: hidden;
}

/* شريط تمرير هادئ */
.scroll-thin::-webkit-scrollbar {
  width: 8px;
}
.scroll-thin::-webkit-scrollbar-thumb {
  background: #2b251e;
  border-radius: 8px;
}
.scroll-thin::-webkit-scrollbar-track {
  background: transparent;
}

/* منزلق مخصص بلون ذهبي */
input[type='range'].slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  border-radius: 999px;
  background: #2b251e;
  outline: none;
}
input[type='range'].slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #d4af6a;
  border: 3px solid #15120f;
  box-shadow: 0 0 0 1px #d4af6a;
  cursor: pointer;
}
input[type='range'].slider::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #d4af6a;
  border: 3px solid #15120f;
  cursor: pointer;
}
input[type='range'].slider:disabled {
  opacity: 0.35;
}

input[type='color'].swatch {
  -webkit-appearance: none;
  border: none;
  width: 36px;
  height: 36px;
  padding: 0;
  background: transparent;
  cursor: pointer;
}
input[type='color'].swatch::-webkit-color-swatch-wrapper {
  padding: 0;
}
input[type='color'].swatch::-webkit-color-swatch {
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 10px;
}

/* خلفية منطقة المعاينة */
.stage-backdrop {
  background:
    radial-gradient(ellipse at 50% 40%, rgba(212, 175, 106, 0.07), transparent 60%),
    repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.012) 0 2px, transparent 2px 14px),
    #070605;
}
</style>
<script>
  window.__LOCAL_FONTS__ = true;
  // محرك إزالة الخلفية المدمج داخل التطبيق
  window.__LOCAL_IMGLY_PATH__ = new URL('imgly/', location.href).href;
</script>
</head>
<body class="font-ui antialiased">
<div id="root">
  <div style="height:100vh;display:grid;place-items:center;color:#e6c98a;background:#070605;font-family:Tajawal,sans-serif;padding:24px">
    <div style="text-align:center;max-width:520px">
      <div style="font-size:18px">جارٍ تجهيز الاستوديو…</div>
      <div id="boot-msg" style="font-size:12px;color:#78716c;margin-top:10px;line-height:1.8"></div>
    </div>
  </div>
</div>
<script>
  (function () {
    function show(msg) {
      var m = document.getElementById('boot-msg');
      if (m && !window.__APP_STARTED__) { m.style.color = '#fca5a5'; m.textContent = msg; }
    }
    window.addEventListener('error', function (e) {
      show('خطأ أثناء التحميل: ' + (e.message || '') + (e.filename ? ' — ' + e.filename : ''));
    });
    window.__bootFail = show;
    setTimeout(function () {
      show('لم تُحمَّل مكتبات الاستوديو خلال 30 ثانية. تأكد من الاتصال بالإنترنت ثم أعد الفتح. إن استمرت المشكلة فقد تكون بعض المواقع محجوبة في منطقتك.');
    }, 30000);
  })();
</script>
<script>
  // إن لم يوجد app.js (المكتبات المدمجة) نستخدم النسخة الاحتياطية التي تحمّل المكتبات من الإنترنت
  function __loadFallback() {
    window.__LOCAL_FONTS__ = false;
    var g = document.createElement('link');
    g.rel = 'stylesheet';
    g.href = 'https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap';
    document.head.appendChild(g);
    var s = document.createElement('script');
    s.type = 'module';
    s.src = 'app-cdn.js';
    s.onerror = function () { window.__bootFail && window.__bootFail('تعذّر تحميل ملفات التطبيق — أعد بناء التطبيق من GitHub'); };
    document.body.appendChild(s);
  }
</script>
<script type="module" src="app.js" onerror="__loadFallback()"></script>
</body>
</html>
